name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_routes: ${{ steps.indexnow.outputs.routes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify content contracts
        run: npm run test:content

      - name: Build site
        run: SITE_BASE=/foundation-model-engineering/ npm run build

      - name: Verify textbook and rendered-site tests
        run: node --test scripts/*.test.mjs

      - name: Restore the public IndexNow verification file
        if: github.repository == 'sungeuns/foundation-model-engineering' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/indexnow-proof
          key: pages-indexnow-proof-v1

      - name: Prepare IndexNow verification and changed page list
        id: indexnow
        if: github.repository == 'sungeuns/foundation-model-engineering' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs prepare

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

  notify:
    name: Notify IndexNow
    needs: [build, deploy]
    # A rerun after an ambiguous POST could duplicate the original notification.
    if: github.event_name == 'push' && github.run_attempt == 1 && needs.build.outputs.indexnow_routes != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/indexnow-proof
          key: pages-indexnow-proof-v1
          fail-on-cache-miss: true
      - name: Verify the published proof and submit changed URLs
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          CHANGED_ROUTES: ${{ needs.build.outputs.indexnow_routes }}
        run: node scripts/indexnow.mjs notify
