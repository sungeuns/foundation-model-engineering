  id: https://sungeuns.github.io/foundation-model-engineering/chapter-7/tiny-decoder-lab/
  image: https://sungeuns.github.io/foundation-model-engineering/social/tiny-decoder-en.png
  name: Build, Break, and Resume a Tiny Decoder
  description: >-
    Train a one-layer decoder on a synthetic copying task in CPU PyTorch.
    Change future input tokens to test the causal mask, remove access to
    previous tokens to measure the loss of context, and resume a checkpoint
    to compare the remaining updates with an uninterrupted run.
    The guide includes a Jupyter notebook and a standalone Python script.
