# OERSI records for both textbook editions and their standalone decoder labs.
- "@context": https://schema.org/
  type: LearningResource
  creativeWorkStatus: Published
  id: https://sungeuns.github.io/foundation-model-engineering/
  name: Foundation Model Engineering
  description: >-
    An English textbook for readers with Python, linear algebra and probability.
    Work through attention and training objectives, then test models under serving,
    retrieval and evaluation constraints. Reproduce a causal mask on a CPU,
    calculate how much memory a batch of requests needs and trace a missing
    citation back to the retrieval stage. Lessons include code, diagrams,
    reasoning questions and references.
  inLanguage: [en]
  creator:
    - type: Person
      givenName: Seongeun
      familyName: So
  license: https://opensource.org/license/mit
  educationalLevel:
    - https://w3id.org/kim/educationalLevel/level_A
  learningResourceType:
    - https://w3id.org/kim/hcrt/textbook
  about:
    - https://w3id.org/kim/hochschulfaechersystematik/n079
  keywords: [foundation models, inference, retrieval, PyTorch]

