<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Textbooks Are All You Need 논문이 공개한 Phi-1 학습 데이터 혼합</title>
  <desc id="desc">선별된 교과서 품질 웹 데이터 60억 토큰과 GPT-3.5가 생성한 교과서 및 연습 문제 10억 토큰이 Phi-1 학습 코퍼스를 구성한다. 코딩 벤치마크 결과만으로 각 데이터 원천의 인과적 기여를 분리할 수 없다는 주의사항을 포함한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect x="8" y="8" width="1184" height="504" rx="24" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="68" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172033">Phi-1: 공개된 데이터 혼합은 단일 원천이 아니다</text>
  <text x="60" y="104" font-family="system-ui,sans-serif" font-size="18" fill="#526078">Textbooks Are All You Need (2023)에 보고된 수치입니다.</text>
  <rect x="65" y="155" width="310" height="130" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="220" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#075985">약 60억 토큰</text>
  <text x="220" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0c4a6e">선별된 “교과서 품질”</text>
  <text x="220" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0c4a6e">웹 코드 데이터</text>
  <rect x="65" y="320" width="310" height="130" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="367" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#92400e">약 10억 토큰</text>
  <text x="220" y="403" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#78350f">GPT-3.5 생성</text>
  <text x="220" y="431" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#78350f">교과서 + 연습 문제</text>
  <path d="M375 220 C445 220 450 285 520 285" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M375 385 C445 385 450 315 520 315" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="535" y="220" width="265" height="165" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="667" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#4c1d95">Phi-1 코퍼스</text>
  <text x="667" y="311" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#5b21b6">총 약 70억 토큰</text>
  <text x="667" y="347" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#526078">1.3B 파라미터 코드 모델</text>
  <path d="M800 302 L900 302" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="915" y="220" width="220" height="165" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1025" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#166534">평가</text>
  <text x="1025" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#166534">HumanEval</text>
  <text x="1025" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#166534">MBPP</text>
  <rect x="515" y="432" width="630" height="55" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="830" y="466" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#526078">전체 결과만으로 각 원천의 인과적 기여를 분리할 수는 없습니다.</text>
</svg>
