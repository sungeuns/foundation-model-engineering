<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="en" role="img" aria-labelledby="card-title card-description">
<title id="card-title">Can “cat” attend to “here”?</title><desc id="card-description">For the query “cat” in “The cat sat here”, the four attention weights in this example are 23.4%, 47.5%, 23.4% and 5.7%. With a causal mask they become 33.0%, 67.0%, 0% and 0%. The weighted output changes from [0.645, 1.241] to [0.330, 1.340].</desc>
