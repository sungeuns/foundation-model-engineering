<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="ko" role="img" aria-labelledby="card-title card-description">
<title id="card-title">요청 D는 언제 디코딩을 시작할까?</title><desc id="card-description">대기 중인 요청 여섯 개가 디코딩 슬롯 세 개를 씁니다. B는 2회차에 끝납니다. D는 연속 배칭에서 3회차, 정적 배칭에서 7회차에 시작합니다. 같은 토큰 22개를 생성하는 데 각각 9회와 11회가 걸립니다. 글자 하나는 생성된 토큰 하나에 해당합니다.</desc>
<rect width="1200" height="630" fill="#f5f2eb"/>
<g font-family="Noto Sans CJK KR, DejaVu Sans, sans-serif" fill="#192a30">
<text x="54" y="83" font-size="51" font-weight="700">요청 D는 언제 디코딩을 시작할까?</text>
<text x="56" y="136" font-size="26" fill="#4e5d61">여섯 요청이 대기 중입니다. 각 줄은 슬롯 하나이고 글자 하나는 생성된 토큰 하나입니다.</text>
<text x="56" y="205" font-size="26" fill="#4e5d61">반복 회차</text><text x="298" y="205" font-size="27" text-anchor="middle" font-weight="600">1</text><text x="378" y="205" font-size="27" text-anchor="middle" font-weight="600">2</text><text x="458" y="205" font-size="27" text-anchor="middle" font-weight="600">3</text><text x="538" y="205" font-size="27" text-anchor="middle" font-weight="600">4</text><text x="618" y="205" font-size="27" text-anchor="middle" font-weight="600">5</text><text x="698" y="205" font-size="27" text-anchor="middle" font-weight="600">6</text><text x="778" y="205" font-size="27" text-anchor="middle" font-weight="600">7</text><text x="858" y="205" font-size="27" text-anchor="middle" font-weight="600">8</text><text x="938" y="205" font-size="27" text-anchor="middle" font-weight="600">9</text><text x="1018" y="205" font-size="27" text-anchor="middle" font-weight="600">10</text><text x="1098" y="205" font-size="27" text-anchor="middle" font-weight="600">11</text>
