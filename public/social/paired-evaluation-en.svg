<text x="61" y="163" font-size="54" font-weight="700">Does the gain</text>
<text x="61" y="232" font-size="54" font-weight="700">justify a release?</text>
<text x="64" y="293" font-size="22" fill="#4e5d61">Compare the same cases. Account for uncertainty.</text>
