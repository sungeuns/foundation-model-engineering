<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="ko" role="img" aria-labelledby="card-title card-description">
<title id="card-title">예측 다섯 개를 왜 여섯 번 채점했을까?</title><desc id="card-description">예측 다섯 개를 고정하고 PyTorch 샘플러로 나눈 결과입니다. 랭크 0은 [0, 2]와 [4], 랭크 1은 [1, 3]과 [0]을 배치로 받습니다. 유일한 오답인 0번이 두 번 들어가 그대로 채점하면 4/6, 샘플마다 한 번씩 채점하면 4/5입니다.</desc>
<rect width="1200" height="630" fill="#f5f2eb"/>
<g font-family="Noto Sans CJK KR, DejaVu Sans, sans-serif" fill="#192a30">
<text x="60" y="87" font-size="53" font-weight="700">예측 다섯 개를 왜 여섯 번 채점했을까?</text>
<text x="64" y="145" font-size="27" fill="#4e5d61">CPU에서 실행한 PyTorch DistributedSampler · 고정된 예측 · 셔플 끔</text>
<path d="M64 173H1136 M765 197V467 M64 510H1136" fill="none" stroke="#bac7bf" stroke-width="2"/>
<text x="202" y="224" font-size="28" fill="#4e5d61" font-weight="600">배치 1</text><text x="517" y="224" font-size="28" fill="#4e5d61" font-weight="600">배치 2</text><text x="64" y="297" font-size="31" font-weight="700">랭크 0</text><rect x="202" y="253" width="102" height="66" rx="10" fill="#f4dfd9" stroke="#893c32" stroke-width="2"/><text x="253" y="298" font-size="34" fill="#893c32" font-weight="700" text-anchor="middle">0 ×</text><rect x="313" y="253" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="364" y="298" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">2 ✓</text><rect x="517" y="253" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="568" y="298" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">4 ✓</text><text x="64" y="391" font-size="31" font-weight="700">랭크 1</text><rect x="202" y="347" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="253" y="392" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">1 ✓</text><rect x="313" y="347" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="364" y="392" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">3 ✓</text><rect x="517" y="347" width="102" height="66" rx="10" fill="#f4dfd9" stroke="#893c32" stroke-width="2"/><text x="568" y="392" font-size="34" fill="#893c32" font-weight="700" text-anchor="middle">0 ×</text><text x="827" y="232" font-size="27" fill="#4e5d61">받은 대로 채점</text><text x="824" y="299" font-size="65" font-weight="700">4 / 6</text><text x="827" y="357" font-size="27" fill="#4e5d61">ID마다 한 번씩 채점</text><text x="824" y="424" font-size="65" font-weight="700">4 / 5</text>
<text x="202" y="463" font-size="24" fill="#4e5d61" xml:space="preserve">샘플 ID     ✓ 정답     × 오답</text>
<text x="64" y="577" font-size="32" font-weight="600">유일한 오답인 0번 샘플이 두 랭크에 모두 들어갔습니다.</text>
</g></svg>
