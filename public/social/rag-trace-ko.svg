    <text x="61" y="142" font-size="54" font-weight="700">7일 환불 규정은 어디서 빠졌을까?</text>
    <text x="64" y="192" font-size="26" fill="#4e5d61">가상의 RAG 사례 · 연간 요금제 갱신 후 환불 문의</text>

