<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="ko" role="img" aria-labelledby="card-title card-description">
  <title id="card-title">7일 환불 규정은 어디서 빠졌을까?</title>
  <desc id="card-description">가상의 갱신 환불 사례입니다. 검색 후보 20개 중 현행 v3의 7일 규정은 8위였습니다. 모델은 상위 5개만 받아 그 안에 남은 v2의 옛 30일 규정을 인용했습니다.</desc>
  <rect width="1200" height="630" fill="#f5f2eb"/>
  <rect width="12" height="630" fill="#256257"/>
