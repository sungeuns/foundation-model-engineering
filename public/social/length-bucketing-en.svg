<title id="card-title">Can less padding lower peak KV memory?</title><desc id="card-description">Measured SmolLM2-135M prefill KV cache for three pairs of prompts. In arrival order the pairs use 990, 900 and 810 KiB. Grouped by length they use 360, 810 and 990 KiB. Padding falls from 18 positions to 6. The largest pair uses 990 KiB in both orders.</desc>
