<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="en" role="img" aria-labelledby="card-title card-description">
<title id="card-title">Why did five predictions get six scores?</title><desc id="card-description">PyTorch sampler audit of five fixed predictions. Rank 0 gets batches [0, 2] and [4]. Rank 1 gets [1, 3] and [0]. Sample 0 is the only wrong prediction and both ranks count it. Accuracy is 4/6 over visits and 4/5 when each sample is scored once.</desc>
<rect width="1200" height="630" fill="#f5f2eb"/>
<g font-family="DejaVu Sans, sans-serif" fill="#192a30">
<text x="60" y="87" font-size="45" font-weight="700">Why did five predictions get six scores?</text>
<text x="64" y="145" font-size="27" fill="#4e5d61">PyTorch DistributedSampler on CPU · fixed predictions · shuffling off</text>
<path d="M64 173H1136 M765 197V467 M64 510H1136" fill="none" stroke="#bac7bf" stroke-width="2"/>
<text x="202" y="224" font-size="28" fill="#4e5d61" font-weight="600">Batch 1</text><text x="517" y="224" font-size="28" fill="#4e5d61" font-weight="600">Batch 2</text><text x="64" y="297" font-size="31" font-weight="700">Rank 0</text><rect x="202" y="253" width="102" height="66" rx="10" fill="#f4dfd9" stroke="#893c32" stroke-width="2"/><text x="253" y="298" font-size="34" fill="#893c32" font-weight="700" text-anchor="middle">0 ×</text><rect x="313" y="253" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="364" y="298" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">2 ✓</text><rect x="517" y="253" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="568" y="298" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">4 ✓</text><text x="64" y="391" font-size="31" font-weight="700">Rank 1</text><rect x="202" y="347" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="253" y="392" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">1 ✓</text><rect x="313" y="347" width="102" height="66" rx="10" fill="#e0ebe3" stroke="#256257" stroke-width="2"/><text x="364" y="392" font-size="34" fill="#256257" font-weight="700" text-anchor="middle">3 ✓</text><rect x="517" y="347" width="102" height="66" rx="10" fill="#f4dfd9" stroke="#893c32" stroke-width="2"/><text x="568" y="392" font-size="34" fill="#893c32" font-weight="700" text-anchor="middle">0 ×</text><text x="827" y="232" font-size="27" fill="#4e5d61">Score every visit</text><text x="824" y="299" font-size="65" font-weight="700">4 / 6</text><text x="827" y="357" font-size="27" fill="#4e5d61">Score each ID once</text><text x="824" y="424" font-size="65" font-weight="700">4 / 5</text>
<text x="202" y="463" font-size="24" fill="#4e5d61" xml:space="preserve">Sample ID     ✓ correct     × wrong</text>
<text x="64" y="577" font-size="29" font-weight="600">Only sample 0 was predicted incorrectly. Both ranks receive it.</text>
</g></svg>
