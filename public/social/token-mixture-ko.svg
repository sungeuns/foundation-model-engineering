<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="ko" role="img" aria-labelledby="card-title card-description">
<title id="card-title">같은 정비 기록 80건을 한 번 읽을 때와 두 번 읽을 때</title><desc id="card-description">두 학습 모두 예측 대상은 112,000토큰입니다. 정비 기록 80건을 한 번 읽으면 32,000토큰(28.6%), 같은 기록을 두 번 읽으면 64,000토큰(57.1%)이 정비 기록에서 나옵니다. 나머지 80,000토큰과 48,000토큰은 각각 리플레이 문서에서 옵니다.</desc>
<rect width="1200" height="630" fill="#f5f2eb"/>
<g font-family="Noto Sans CJK KR, DejaVu Sans, sans-serif" fill="#192a30">
<text x="58" y="88" font-size="47" font-weight="700">같은 정비 기록 80건을 한 번 읽을 때와 두 번 읽을 때</text>
<text x="60" y="145" font-size="38" fill="#4e5d61">두 학습 모두 예측 대상은 112,000토큰입니다.</text>
<g id="one_pass">
<text x="60" y="227" font-size="38" font-weight="700">각 기록을 한 번씩</text>
<text x="1140" y="227" font-size="38" text-anchor="end" fill="#256257" font-weight="700">정비 기록 비율 28.6%</text>
<rect x="60" y="245" width="1080" height="59" rx="4" fill="#dbe2df"/>
<rect x="60" y="245" width="308.57142857142856" height="59" rx="4" fill="#256257"/>
<text x="214.28571428571428" y="287" font-size="37" fill="white" text-anchor="middle" font-weight="700">32,000</text>
<text x="754.2857142857142" y="287" font-size="37" text-anchor="middle" font-weight="700">80,000</text>
</g>
<g id="repeat_domain">
<text x="60" y="365" font-size="38" font-weight="700">각 기록을 두 번씩</text>
<text x="1140" y="365" font-size="38" text-anchor="end" fill="#256257" font-weight="700">정비 기록 비율 57.1%</text>
<rect x="60" y="383" width="1080" height="59" rx="4" fill="#dbe2df"/>
<rect x="60" y="383" width="617.1428571428571" height="59" rx="4" fill="#256257"/>
<text x="368.57142857142856" y="425" font-size="37" fill="white" text-anchor="middle" font-weight="700">64,000</text>
<text x="908.5714285714286" y="425" font-size="37" text-anchor="middle" font-weight="700">48,000</text>
</g>
