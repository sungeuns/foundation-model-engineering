<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="en" role="img" aria-labelledby="card-title card-description">
<title id="card-title">When can request D start decoding?</title><desc id="card-description">Six queued requests share three decode slots. Request B finishes in iteration 2. Continuous batching admits D at iteration 3, while static batching admits D at iteration 7. The same 22 decode tokens finish in 9 and 11 iterations respectively. Each letter represents one generated token.</desc>
<rect width="1200" height="630" fill="#f5f2eb"/>
<g font-family="DejaVu Sans, sans-serif" fill="#192a30">
<text x="54" y="83" font-size="51" font-weight="700">When can request D start decoding?</text>
<text x="56" y="136" font-size="26" fill="#4e5d61">Six requests are queued. Each row is a slot and each letter is one generated token.</text>
<text x="56" y="205" font-size="26" fill="#4e5d61">Iteration</text><text x="298" y="205" font-size="27" text-anchor="middle" font-weight="600">1</text><text x="378" y="205" font-size="27" text-anchor="middle" font-weight="600">2</text><text x="458" y="205" font-size="27" text-anchor="middle" font-weight="600">3</text><text x="538" y="205" font-size="27" text-anchor="middle" font-weight="600">4</text><text x="618" y="205" font-size="27" text-anchor="middle" font-weight="600">5</text><text x="698" y="205" font-size="27" text-anchor="middle" font-weight="600">6</text><text x="778" y="205" font-size="27" text-anchor="middle" font-weight="600">7</text><text x="858" y="205" font-size="27" text-anchor="middle" font-weight="600">8</text><text x="938" y="205" font-size="27" text-anchor="middle" font-weight="600">9</text><text x="1018" y="205" font-size="27" text-anchor="middle" font-weight="600">10</text><text x="1098" y="205" font-size="27" text-anchor="middle" font-weight="600">11</text>
