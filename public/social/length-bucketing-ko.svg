<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xml:lang="ko" role="img" aria-labelledby="card-title card-description">
<title id="card-title">길이순으로 묶으면 최대 KV 캐시도 줄어들까?</title><desc id="card-description">SmolLM2-135M으로 프롬프트를 두 개씩 처리한 뒤 측정한 프리필 KV 캐시입니다. 도착 순서에서는 배치마다 990, 900, 810 KiB를 쓰고, 길이 순서에서는 360, 810, 990 KiB를 씁니다. 패딩은 총 18자리에서 6자리로 줄고 두 경우 모두 가장 큰 배치는 990 KiB를 씁니다.</desc>
